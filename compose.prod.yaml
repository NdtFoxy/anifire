# Production stack: docker compose -f compose.prod.yaml --env-file .env.prod up -d --build
# Copy .env.prod.example to .env.prod and fill it in first. Only Caddy publishes
# ports; the API, database and sidecar are reachable solely inside `internal`,
# which is what makes X-Forwarded-For (set by Caddy) trustworthy for rate limits.
name: anifire

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ANIFIRE_DOMAIN: ${ANIFIRE_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      internal:
        # Fixed address: the backend accepts proxy headers only from here.
        ipv4_address: 172.28.0.10
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

  backend:
    build: ./anime-backend/anime-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      ANIFIRE_SECURITY_PEPPER: ${ANIFIRE_SECURITY_PEPPER}
      ANIFIRE_JWT_ISSUER: https://${ANIFIRE_DOMAIN}
      ANIFIRE_JWT_JWK_SET: ${ANIFIRE_JWT_JWK_SET}
      ANIFIRE_CORS_ALLOWED_ORIGINS: https://${ANIFIRE_DOMAIN}
      ANIFIRE_APP_FRONTEND_URL: https://${ANIFIRE_DOMAIN}
      ANIFIRE_GEO_TRUSTEDPROXIES: 172.28.0.10
      ANIFIRE_LING_URL: http://ling:8090
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      ANIFIRE_MAIL_FROM: ${ANIFIRE_MAIL_FROM}
      ANIFIRE_BILLING_SHOP_ID: ${ANIFIRE_BILLING_SHOP_ID}
      ANIFIRE_BILLING_SECRET_KEY: ${ANIFIRE_BILLING_SECRET_KEY}
      ANIFIRE_BILLING_RETURN_URL: https://${ANIFIRE_DOMAIN}/profile?tab=subscription&billing=return
      ANIFIRE_OAUTH_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SPRING_DATA_REDIS_HOST: redis
      SENTRY_DSN: ${SENTRY_DSN:-}
      ANIFIRE_UPLOADS_STORAGE: s3
      ANIFIRE_UPLOADS_S3_ENDPOINT: http://minio:9000
      ANIFIRE_UPLOADS_S3_BUCKET: uploads
      ANIFIRE_UPLOADS_S3_ACCESSKEY: ${MINIO_ROOT_USER}
      ANIFIRE_UPLOADS_S3_SECRETKEY: ${MINIO_ROOT_PASSWORD}
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./anime-streaming
      args:
        NEXT_PUBLIC_BACKEND_URL: https://${ANIFIRE_DOMAIN}
        NEXT_PUBLIC_API_URL: https://${ANIFIRE_DOMAIN}/api/v1/animes
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN:-}
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8080
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      JIMAKU_API_KEY: ${JIMAKU_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - subtitle_cache:/app/.cache
    networks: [internal]

  ling:
    build: ./ling
    restart: unless-stopped
    networks: [internal]

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Watch-party rooms (shared by every API instance) and their pub/sub fan-out.
  # Ephemeral by design: no persistence volume.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Object storage for user uploads (and the local copy target for backups).
  # Caddy serves /uploads/* straight from the public-read `uploads` bucket.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: buckets exist before the API starts. Idempotent on every `up`.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    # Anonymous read of single objects only: `mc anonymous set download` would also
    # grant ListBucket and publish every uploaded file name.
    volumes:
      - ./deploy/minio/uploads-policy.json:/policy/uploads.json:ro
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
             mc mb --ignore-existing local/uploads local/backups &&
             mc anonymous set-json /policy/uploads.json local/uploads"
    networks: [internal]

  # Nightly pg_dump, verified, kept 14 days; copied to BACKUP_S3_* (defaults to
  # the MinIO `backups` bucket — point it at an off-site bucket in .env.prod).
  backup:
    build: ./deploy/backup
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-http://minio:9000}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-backups}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-${MINIO_ROOT_USER}}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
    volumes:
      - backups:/backups
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  minio_data:
  backups:
  subtitle_cache:
  caddy_data:
  caddy_config:

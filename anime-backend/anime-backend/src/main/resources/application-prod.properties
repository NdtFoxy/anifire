# Production profile: activate with SPRING_PROFILES_ACTIVE=prod.
#
# Values that differ in production are either forced here (show-sql, seed,
# secure cookie, real billing provider) or mapped to environment variables with a
# BLANK default. Blank rather than an unresolved placeholder: Spring keeps an
# unresolved "${...}" as a literal string and would happily use it. StartupSafetyCheck
# then rejects every blank or still-development value, listing them all at once.
#
# Not listed on purpose, because they bind straight from the environment and the
# check already refuses their development defaults:
#   SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
#   ANIFIRE_SECURITY_PEPPER   (a blank pepper would crash the encoder before the check)
#   ANIFIRE_JWT_ISSUER

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
anifire.seed.enabled=false

anifire.cors.allowed-origins=${ANIFIRE_CORS_ALLOWED_ORIGINS:}
anifire.app.frontend-url=${ANIFIRE_APP_FRONTEND_URL:}

anifire.jwt.jwk-set=${ANIFIRE_JWT_JWK_SET:}

anifire.security.cookie-secure=true

anifire.billing.provider=yookassa
anifire.billing.shop-id=${ANIFIRE_BILLING_SHOP_ID:}
anifire.billing.secret-key=${ANIFIRE_BILLING_SECRET_KEY:}
anifire.billing.return-url=${ANIFIRE_BILLING_RETURN_URL:}

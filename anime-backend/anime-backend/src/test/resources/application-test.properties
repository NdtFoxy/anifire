spring.datasource.url=jdbc:h2:mem:anifire_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# Tests run on H2; the Postgres migrations don't apply there, so the schema is
# generated from the entities instead.
spring.flyway.enabled=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
anifire.seed.enabled=false
anifire.cors.allowed-origins=http://localhost:3000
anifire.app.frontend-url=http://localhost:3000
anifire.jwt.issuer=https://auth.anifire.local
anifire.jwt.audience=anifire-web
anifire.jwt.access-ttl=PT15M
anifire.jwt.refresh-ttl=P30D
anifire.jwt.jwk-set=
anifire.security.pepper=ZGV2LW9ubHktcGVwcGVyLWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9u
anifire.security.cookie-secure=false
anifire.security.max-failed-attempts=5
anifire.security.lock-duration=PT15M
anifire.security.breach-check-enabled=false
# Uploads land in the build dir so test runs never pollute the real ./uploads.
anifire.uploads.dir=./build/test-uploads
anifire.uploads.max-file-size=5MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
anifire.oauth.providers.google.client-id=test-client-id.apps.googleusercontent.com
anifire.oauth.providers.google.issuer=https://accounts.google.com
anifire.oauth.providers.google.jwks-uri=https://www.googleapis.com/oauth2/v3/certs
anifire.geo.enabled=true
anifire.geo.headers=X-Country-Code
anifire.geo.trusted-proxies=127.0.0.1
anifire.geo.block-unknown=false
anifire.mail.enabled=false
anifire.mail.from=Anifire <no-reply@anifire.test>
anifire.notifications.enabled=false

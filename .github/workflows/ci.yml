name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anime-backend/anime-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      # Unit/slice tests run on in-memory H2 (src/test/resources/application-test.properties).
      - run: ./gradlew test
      # Flyway migrations + Hibernate validation + Postgres-only SQL against a
      # real postgres:16 via Testcontainers (the runner provides Docker).
      - run: ./gradlew integrationTest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anime-streaming
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: anime-streaming/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
